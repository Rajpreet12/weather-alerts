<!doctype html>
<html><head><meta charset="utf-8"><title>Weather alerts flowchart</title>
<style>
  html,body{margin:0;padding:0;background:#0b1e3a}
  body{width:1080px;height:1350px;font-family:"Segoe UI",system-ui,sans-serif}
</style></head>
<body>
<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1e3a"/><stop offset="1" stop-color="#0c4a6e"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#bae6fd"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4ade80"/></marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#fb7185"/></marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <!-- header -->
  <text x="60" y="78" font-size="18" font-weight="700" fill="#7dd3fc" letter-spacing="4">HOW ONE MORNING RUNS</text>
  <text x="60" y="132" font-size="50" font-weight="800" fill="#fff">Silence Is a <tspan fill="#fde68a">Feature</tspan></text>
  <text x="60" y="172" font-size="21" fill="#e0f2fe">Serverless weather alerts that only speak up when it matters</text>

  <!-- 1. scheduler -->
  <g filter="url(#sh)"><rect x="300" y="215" width="480" height="78" rx="16" fill="#7c3aed"/></g>
  <text x="540" y="250" text-anchor="middle" font-size="23" font-weight="800" fill="#fff">⏰ 7:00 a.m. local time</text>
  <text x="540" y="278" text-anchor="middle" font-size="16" fill="#ede9fe">EventBridge Scheduler · timezone-aware cron</text>
  <path d="M540 293 V323" stroke="#bae6fd" stroke-width="3" marker-end="url(#ar)"/>

  <!-- 2. lambda + query -->
  <g filter="url(#sh)"><rect x="300" y="330" width="480" height="96" rx="16" fill="#fff"/></g>
  <rect x="300" y="330" width="480" height="10" rx="5" fill="#fb923c"/>
  <text x="540" y="368" text-anchor="middle" font-size="23" font-weight="800" fill="#0f172a">λ Daily check runs</text>
  <text x="540" y="396" text-anchor="middle" font-size="16" fill="#475569">Query DynamoDB GSI ByCheckHour = "07"</text>
  <text x="540" y="416" text-anchor="middle" font-size="15" fill="#047857" font-weight="700">only what's due · no full-table Scan</text>
  <path d="M540 426 V456" stroke="#bae6fd" stroke-width="3" marker-end="url(#ar)"/>

  <!-- 3. group -->
  <g filter="url(#sh)"><rect x="300" y="463" width="480" height="78" rx="16" fill="#fff"/></g>
  <rect x="300" y="463" width="480" height="10" rx="5" fill="#38bdf8"/>
  <text x="540" y="501" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a">🌦️ One forecast per city</text>
  <text x="540" y="527" text-anchor="middle" font-size="16" fill="#475569">results arrive grouped · Open-Meteo, no API key</text>
  <path d="M540 541 V573" stroke="#bae6fd" stroke-width="3" marker-end="url(#ar)"/>

  <!-- 4. decision: rule crossed? -->
  <g filter="url(#sh)"><polygon points="540,580 700,655 540,730 380,655" fill="#fde68a"/></g>
  <text x="540" y="650" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a">Rule crossed?</text>
  <text x="540" y="676" text-anchor="middle" font-size="15" fill="#713f12">rain ≥ 60% · low ≤ −10°C …</text>

  <!-- no -> silence -->
  <path d="M380 655 H248" stroke="#94a3b8" stroke-width="3" marker-end="url(#arS)"/>
  <text x="318" y="642" text-anchor="middle" font-size="17" font-weight="800" fill="#cbd5e1">NO</text>
  <g filter="url(#sh)"><rect x="40" y="603" width="205" height="104" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2"/></g>
  <text x="142" y="645" text-anchor="middle" font-size="26">🤫</text>
  <text x="142" y="675" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">Stay silent</text>
  <text x="142" y="697" text-anchor="middle" font-size="14" fill="#94a3b8">most days end here</text>

  <!-- yes -> already sent? -->
  <path d="M540 730 V770" stroke="#4ade80" stroke-width="3" marker-end="url(#arG)"/>
  <text x="560" y="757" font-size="17" font-weight="800" fill="#4ade80">YES</text>
  <g filter="url(#sh)"><polygon points="540,777 700,852 540,927 380,852" fill="#fde68a"/></g>
  <text x="540" y="846" text-anchor="middle" font-size="21" font-weight="800" fill="#0f172a">Already sent</text>
  <text x="540" y="872" text-anchor="middle" font-size="21" font-weight="800" fill="#0f172a">today?</text>

  <!-- yes -> skip -->
  <path d="M700 852 H832" stroke="#94a3b8" stroke-width="3" marker-end="url(#arS)"/>
  <text x="766" y="839" text-anchor="middle" font-size="17" font-weight="800" fill="#cbd5e1">YES</text>
  <g filter="url(#sh)"><rect x="835" y="800" width="205" height="104" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2"/></g>
  <text x="937" y="842" text-anchor="middle" font-size="26">⏭️</text>
  <text x="937" y="872" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">Skip</text>
  <text x="937" y="894" text-anchor="middle" font-size="14" fill="#94a3b8">no duplicate on retry</text>

  <!-- no -> publish -->
  <path d="M540 927 V967" stroke="#4ade80" stroke-width="3" marker-end="url(#arG)"/>
  <text x="560" y="954" font-size="17" font-weight="800" fill="#4ade80">NO</text>
  <g filter="url(#sh)"><rect x="300" y="974" width="480" height="96" rx="16" fill="#fff"/></g>
  <rect x="300" y="974" width="480" height="10" rx="5" fill="#f43f5e"/>
  <text x="540" y="1012" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a">📣 Publish to one SNS topic</text>
  <text x="540" y="1040" text-anchor="middle" font-size="16" fill="#475569">filter policy routes it to one subscriber</text>
  <text x="540" y="1060" text-anchor="middle" font-size="15" fill="#475569">then record lastAlertDate</text>
  <path d="M540 1070 V1102" stroke="#4ade80" stroke-width="3" marker-end="url(#arG)"/>

  <!-- inbox -->
  <g filter="url(#sh)"><rect x="330" y="1109" width="420" height="82" rx="16" fill="#10b981"/></g>
  <text x="540" y="1147" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">📬 Only the right inbox</text>
  <text x="540" y="1175" text-anchor="middle" font-size="15" fill="#d1fae5">double opt-in + unsubscribe built in</text>

  <!-- failure lane -->
  <path d="M780 378 C900 378 930 420 930 470 V560" stroke="#fb7185" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#arR)"/>
  <text x="840" y="365" font-size="15" font-weight="700" fill="#fda4af">API timeout?</text>
  <g filter="url(#sh)"><rect x="835" y="566" width="205" height="160" rx="16" fill="#3f1d2b" stroke="#fb7185" stroke-width="2"/></g>
  <text x="937" y="604" text-anchor="middle" font-size="24">🔁</text>
  <text x="937" y="633" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">Retry whole run</text>
  <text x="937" y="657" text-anchor="middle" font-size="14" fill="#fecdd3">Lambda async ×2</text>
  <text x="937" y="679" text-anchor="middle" font-size="14" fill="#fecdd3">then 🧯 SQS dead-letter</text>
  <text x="937" y="701" text-anchor="middle" font-size="14" fill="#fecdd3">queue: never silent</text>

  <!-- footer -->
  <line x1="60" y1="1232" x2="1020" y2="1232" stroke="#38bdf8" stroke-opacity=".35"/>
  <g font-size="16" fill="#e0f2fe">
    <text x="60" y="1270">EventBridge Scheduler · Lambda · DynamoDB · SNS · API Gateway · AWS SAM</text>
    <text x="60" y="1302" fill="#7dd3fc" font-weight="700">github.com/Rajpreet12/weather-alerts</text>
  </g>
  <g text-anchor="end">
    <text x="1020" y="1272" font-size="30" font-weight="800" fill="#fde68a">~$0/mo</text>
    <text x="1020" y="1300" font-size="14" fill="#bae6fd" letter-spacing="2">AT HOBBY SCALE</text>
  </g>
</svg>
</body></html>
