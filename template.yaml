AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless weather alerts — EventBridge Scheduler + Lambda + DynamoDB + SNS email

Parameters:
  ScheduleExpression:
    Type: String
    Default: cron(0 7 * * ? *)
    Description: When the daily check runs (EventBridge Scheduler syntax)
  ScheduleTimezone:
    Type: String
    Default: America/Edmonton
    Description: IANA timezone the schedule is evaluated in (handles daylight saving)
  MaxAlertsPerEmail:
    Type: Number
    Default: 3

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 256
    CodeUri: src/
    Environment:
      Variables:
        TABLE_NAME: !Ref SubscriptionsTable
        TOPIC_ARN: !Ref AlertsTopic

Resources:
  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: checkHour
          AttributeType: S
        - AttributeName: locKey
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        # The daily job Queries this instead of Scanning the table: only the
        # subscriptions due at that hour, sorted (= grouped) by location.
        - IndexName: ByCheckHour
          KeySchema:
            - AttributeName: checkHour
              KeyType: HASH
            - AttributeName: locKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ByEmail
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: KEYS_ONLY
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # One topic for everyone. Each email subscription carries a filter policy
  # so it only receives messages tagged with its own subscriptionId.
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Weather Alerts
      KmsMasterKeyId: alias/aws/sns

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Public endpoint: throttle it so it can't be used to mass-send confirmation emails.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: ['GET', 'POST', 'OPTIONS']
        AllowHeaders: ['Content-Type']

  SubscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: subscribe.handler
      Timeout: 10
      Environment:
        Variables:
          MAX_PER_EMAIL: !Ref MaxAlertsPerEmail
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
        - Statement:
            - Effect: Allow
              Action: sns:Subscribe
              Resource: !Ref AlertsTopic
            # To tell the user whether they still need to click "Confirm subscription".
            # SNS authorizes this against the TOPIC ARN, not the subscription ARN
            # (granting "${AlertsTopic}:*" alone fails with AuthorizationErrorException).
            - Effect: Allow
              Action: sns:GetSubscriptionAttributes
              Resource: !Ref AlertsTopic
      Events:
        Subscribe:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /subscriptions
            Method: POST

  # GET shows a confirm page, POST removes ONE alert (one city). The SNS
  # unsubscribe link in the email footer still removes everything for that address.
  UnsubscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: unsubscribe.handler
      Timeout: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
        # Only when the last alert for an address is removed.
        - Statement:
            - Effect: Allow
              Action: sns:Unsubscribe
              Resource:
                - !Ref AlertsTopic
                - !Sub ${AlertsTopic}:*
      Events:
        ShowConfirm:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /unsubscribe
            Method: GET
        Confirm:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /unsubscribe
            Method: POST

  CheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: check.handler
      Timeout: 300
      Environment:
        Variables:
          # Used to build the per-alert unsubscribe link in each email.
          API_URL: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
          # Run history is keyed by the local date, same timezone as the schedule.
          SCHEDULE_TZ: !Ref ScheduleTimezone
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertsTopic.TopicName
      # Scheduler invokes Lambda asynchronously. If the function itself throws,
      # Lambda's async retries kick in, then the event lands in this SQS queue.
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 3600
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt FailedRunsQueue.Arn
      Events:
        DailyCheck:
          Type: ScheduleV2
          Properties:
            # Without an explicit name SAM uses "CheckFunctionDailyCheck", which isn't
            # stack-specific: a second copy of this stack in the same account would clash.
            Name: !Sub ${AWS::StackName}-daily-check
            ScheduleExpression: !Ref ScheduleExpression
            ScheduleExpressionTimezone: !Ref ScheduleTimezone
            # Covers failures to *deliver* the invocation (throttling, permissions).
            RetryPolicy:
              MaximumRetryAttempts: 3
              MaximumEventAgeInSeconds: 3600
            DeadLetterConfig:
              Arn: !GetAtt SchedulerDeadLetterQueue.Arn

  # Explicit (not SAM-generated) so the dashboard and alarms can name them.
  FailedRunsQueue:            # Lambda async failures: your code threw 3 times
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  SchedulerDeadLetterQueue:   # Scheduler couldn't deliver the invocation at all
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # Public, read-only live status page (aggregate counts only).
  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: status.handler
      Timeout: 10
      Environment:
        Variables:
          SCHEDULE_TZ: !Ref ScheduleTimezone
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SubscriptionsTable
      Events:
        Status:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /status
            Method: GET

  # Something landed in a failure queue = a morning run didn't fully work.
  FailedRunsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-failed-runs
      AlarmDescription: The daily check threw after all retries
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt FailedRunsQueue.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  SchedulerDeliveryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-scheduler-undelivered
      AlarmDescription: EventBridge Scheduler could not invoke the daily check
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt SchedulerDeadLetterQueue.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}-dashboard
      DashboardBody: !Sub |
        {
          "widgets": [
            { "type": "text", "x": 0, "y": 0, "width": 24, "height": 2,
              "properties": { "markdown": "## Weather alerts: live\nPublic status page: https://${Api}.execute-api.${AWS::Region}.amazonaws.com/status · daily check ${ScheduleExpression} (${ScheduleTimezone})" } },
            { "type": "metric", "x": 0, "y": 2, "width": 12, "height": 6,
              "properties": { "title": "Each morning: what happened to every alert", "region": "${AWS::Region}", "view": "bar", "stacked": true, "stat": "Sum", "period": 86400,
                "metrics": [ ["WeatherAlerts", "Sent", { "color": "#f43f5e" }], [".", "NotTriggered", { "color": "#94a3b8" }], [".", "AlreadySent", { "color": "#38bdf8" }], [".", "Failed", { "color": "#b91c1c" }] ] } },
            { "type": "metric", "x": 12, "y": 2, "width": 12, "height": 6,
              "properties": { "title": "Emails: delivered vs failed (SNS)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 3600,
                "metrics": [ ["AWS/SNS", "NumberOfNotificationsDelivered", "TopicName", "${AlertsTopic.TopicName}"], [".", "NumberOfNotificationsFailed", ".", "."] ] } },
            { "type": "metric", "x": 0, "y": 8, "width": 8, "height": 6,
              "properties": { "title": "Daily check: errors and run time", "region": "${AWS::Region}", "view": "timeSeries", "period": 3600,
                "metrics": [ ["AWS/Lambda", "Errors", "FunctionName", "${CheckFunction}", { "stat": "Sum" }], [".", "Duration", ".", ".", { "stat": "Maximum", "yAxis": "right" }] ] } },
            { "type": "metric", "x": 8, "y": 8, "width": 8, "height": 6,
              "properties": { "title": "API: requests and errors", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 3600,
                "metrics": [ ["AWS/ApiGateway", "Count", "ApiId", "${Api}"], [".", "4xx", ".", "."], [".", "5xx", ".", "."] ] } },
            { "type": "metric", "x": 16, "y": 8, "width": 8, "height": 6,
              "properties": { "title": "Failure queues (should stay at 0)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 300,
                "metrics": [ ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${FailedRunsQueue.QueueName}"], ["...", "${SchedulerDeadLetterQueue.QueueName}"] ] } },
            { "type": "alarm", "x": 0, "y": 14, "width": 24, "height": 2,
              "properties": { "title": "Alarms", "alarms": [ "${FailedRunsAlarm.Arn}", "${SchedulerDeliveryAlarm.Arn}" ] } }
          ]
        }

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  StatusPageUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/status
  DashboardUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${Dashboard}
  CheckFunctionName:
    Value: !Ref CheckFunction
  SubscriptionsTableName:
    Value: !Ref SubscriptionsTable
  AlertsTopicArn:
    Value: !Ref AlertsTopic
